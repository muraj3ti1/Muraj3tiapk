name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard - signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Signing secrets missing. Refusing to build with a debug key (users could not update over it)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: App icon
        run: |
          if [ -f assets/icon-only.png ]; then
            npx --yes @capacitor/assets generate --android
          fi

      - name: Sync
        run: npx cap sync android

      - name: Native splash image
        run: |
          find android/app/src/main/res -type f -name 'splash.png' -delete
          mkdir -p android/app/src/main/res/drawable
          cp native/splash.png android/app/src/main/res/drawable/splash.png

      - name: Native splash + Google sign-in deep link
        run: |
          RES=android/app/src/main/res
          JAVA=android/app/src/main/java/com/muraj3ti/murajaati
          cp native/styles.xml $RES/values/styles.xml
          cp native/splash_colors.xml $RES/values/splash_colors.xml
          cp native/splash_icon_empty.xml $RES/drawable/splash_icon_empty.xml
          cp native/MainActivity.java $JAVA/MainActivity.java
          python3 native/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Set version code
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p out
          echo "$KS" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out out/murajaati.apk aligned.apk
          rm -f release.jks

      - name: Verify APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/aapt dump badging out/murajaati.apk | grep -E "package: name"
          $BT/aapt dump badging out/murajaati.apk | grep "package: name='com.muraj3ti.murajaati'"
          $BT/aapt dump permissions out/murajaati.apk | grep RECORD_AUDIO
          $BT/apksigner verify --print-certs out/murajaati.apk | grep "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: murajaati-apk
          path: out/murajaati.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: مراجعتي v${{ github.run_number }}
          files: out/murajaati.apk
